<article
  class="
    fora-card fora-pricing-card
    {% if plan.highlighted %}
      fora-pricing-card-recommended
    {% endif %}
  "
>
  <div class="fora-pricing-card-heading">
    <h3 class="fora-subheading">
      {{ plan.name }}
    </h3>

    {% if plan.highlighted %}
      <span class="fora-badge">
        Recommended
      </span>
    {% endif %}
  </div>

  <p class="fora-copy fora-pricing-card-description">
    {{ plan.description }}
  </p>

  <div class="fora-pricing-card-price">
    <span class="fora-pricing-card-amount">
      ${{ plan.price }}
    </span>

    <span class="ml-2 text-sm text-fora-text-muted">
      {{ plan.currency }}
    </span>
  </div>

  <p class="mt-2 text-sm text-fora-text-subtle">
    {{ plan.billing_period }}
  </p>

  <ul class="fora-pricing-card-features">
    {% for item in plan.deliverables %}
      <li class="flex gap-3">
        <span aria-hidden="true" class="text-fora-text">
          ✓
        </span>

        <span class="min-w-0">
          {{ item }}
        </span>
      </li>
    {% endfor %}
  </ul>

  <div class="mt-auto pt-9">
    <a class="fora-button fora-button-secondary w-full" href="{% url 'marketing:start_project' %}?plan={{ plan.id|urlencode }}">{{ plan.cta_label }}</a>
  </div>
</article>
