{% extends "layouts/base.html" %}

{% block title %}FAQ — {{ fora.brand.name }}{% endblock %}

{% block content %}
<section class="fora-container py-20 sm:py-28">
  <div class="max-w-3xl">
    <p class="mb-4 text-sm font-medium uppercase tracking-[0.16em] text-fora-text-muted">
      FAQ
    </p>

    <h1 class="text-4xl font-semibold tracking-[-0.04em] sm:text-6xl">
      Common questions.
    </h1>
  </div>

  <div class="mt-14 max-w-4xl divide-y divide-fora-border border-y border-fora-border">
    {% for item in faqs %}
      <article class="py-7">
        <h2 class="text-xl font-semibold">
          {{ item.question }}
        </h2>

        <p class="mt-3 leading-7 text-fora-text-muted">
          {{ item.answer }}
        </p>
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
